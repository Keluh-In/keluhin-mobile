name: Keluhin
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  intl: ^0.20.2
  http: ^1.6.0
  google_fonts: ^6.2.1
  rename_app: ^1.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Hapus flutter_launcher_name jadul, sisakan 2 ini yang sudah support Null Safety
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# --- REVISI KONFIGURASI ICON ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

# --- REVISI KONFIGURASI SPLASH SCREEN ---
flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/splash.png"
  android_12:
    image: "assets/images/splash.png"
    color: "#ffffff"
  fullscreen: true

flutter:
  uses-material-design: true
  # --- REGISTRASI FOLDER ASSETS ---
  assets:
    - assets/images/